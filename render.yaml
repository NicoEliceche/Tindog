# https://render.com/schema/render.yaml.json
services:
  - type: web
    name: tindog-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run render:build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
